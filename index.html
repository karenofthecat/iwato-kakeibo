  x.label=`${category} ${x.amount} ${card}${memo?' '+memo:''} 請求${billYM}`;
  const rec=data.receivables.find(r=>r.entryId===x.id);
  if(rec){
   if(category!=='代理'){data.receivables=data.receivables.filter(r=>r.entryId!==x.id)}
   else{const diff=x.amount-oldAmount;rec.memo=memo||'代理';rec.method=card;rec.original=x.amount;rec.remaining=Math.max(0,rec.remaining+diff);rec.status=rec.remaining>0?'open':'paid'}
  }else if(category==='代理'&&oldCategory!=='代理'&&x.amount>0){
   data.receivables.push({id:uid(),entryId:x.id,date:x.date,memo:memo||'代理',original:x.amount,remaining:x.amount,method:card,status:'open'})
  }
 }else if(type==='install'){
  const name=prompt('名称',x.name||'');if(name===null)return;
  const amount=prompt('月額',String(x.amount));if(amount===null||!Number.isFinite(+amount))return;
  const category=prompt('費目',x.category||'その他');if(category===null)return;
  const card=prompt('カード名',x.card||'');if(card===null||!cardMethods.includes(card))return toast('カード名を確認');
  const startYM=prompt('開始請求月（YYYY-MM）',x.startYM);if(startYM===null||!/^\d{4}-\d{2}$/.test(startYM))return;
  const endYM=prompt('終了請求月（YYYY-MM）',x.endYM);if(endYM===null||!/^\d{4}-\d{2}$/.test(endYM))return;
  Object.assign(x,{name,amount:+amount,category,card,startYM,endYM})
 }else if(type==='confirmed'){
  const name=prompt('名称',x.name||'確定請求');if(name===null)return;
  const amount=prompt('金額',String(x.amount));if(amount===null||!Number.isFinite(+amount))return;
  const card=prompt('カード名',x.card||'');if(card===null||!cardMethods.includes(card))return toast('カード名を確認');
  const billYM=prompt('請求年月（YYYY-MM）',x.billYM);if(billYM===null||!/^\d{4}-\d{2}$/.test(billYM))return;
  Object.assign(x,{name,amount:+amount,card,billYM})
 }
 render();toast('カード明細を修正しました')
}
window.refundCardRow=(type,id)=>{
 const x=getCardSource(type,id);if(!x)return;
 const original=Math.abs(+x.amount||0);
 const raw=prompt('返金額',String(original));if(raw===null)return;
 const amount=Math.abs(+raw||0);if(!amount)return;
 const card=x.method||x.card;if(!cardMethods.includes(card))return toast('カード情報がありません');
 const defaultYM=x.billYM||data.cardViewMonth||currentYM();
 const billYM=prompt('返金が反映される請求月（YYYY-MM）',defaultYM);if(billYM===null||!/^\d{4}-\d{2}$/.test(billYM))return toast('請求年月を確認');
 const memo=prompt('返金メモ',`${x.memo||x.name||'カード利用'} 返金`);if(memo===null)return;
 addRestorePoint(`カード返金登録前 ${memo}`);
 addEntry({type:'cardDetail',category:'返金',method:card,amount:-amount,memo,label:`返金 ${-amount} ${card} ${memo} 請求${billYM}`,billYM,affectBalance:false,date:today()});
 data.draft.push(`返金 ${amount} ${card} ${memo} 請求${billYM}`);
 render();toast('返金を登録しました')
}
window.deleteCardRow=(type,id)=>{
 const x=getCardSource(type,id);if(!x||!confirm('このカード明細を削除しますか？'))return;
 addRestorePoint(`カード明細削除前 ${x.memo||x.name||''}`);
 if(type==='entry'){data.entries=data.entries.filter(e=>e.id!==id);data.receivables=data.receivables.filter(r=>r.entryId!==id)}
 if(type==='install')data.installments=data.installments.filter(e=>e.id!==id);
 if(type==='confirmed')data.confirmedCards=data.confirmedCards.filter(e=>e.id!==id);
 render();toast('削除しました')
}
function addEntry(e){e.id=e.id||uid();e.date=e.date||today();data.entries.push(e)}
function addExpense(){const category=q('cat').value,method=q('method').value,amount=+q('amount').value,memo=q('memo').value.trim(),affect=q('affectBalance').value==='yes',billYM=q('billMonth').value||currentYM();if(!amount)return toast('金額を入力');const label=`${category} ${amount} ${method}${memo?' '+memo:''}${cardMethods.includes(method)?' 請求'+billYM:''}${!affect?' 過去分':''}`;const e={type:'expense',category,method,amount,memo,label,billYM,affectBalance:affect};addEntry(e);data.draft.push(label);if(affect&&moneyMethods.includes(method))data.balances[method]=(data.balances[method]||0)-amount;if(category==='代理')data.receivables.push({id:uid(),entryId:e.id,date:e.date,memo:memo||'代理',original:amount,remaining:amount,method,status:'open'});q('amount').value='';q('memo').value='';render()}
function addIncome(){const method=q('incomeTo').value,amount=+q('incomeAmount').value,memo=q('incomeMemo').value.trim();if(!amount)return toast('金額を入力');const label=`入金 ${amount} ${method}${memo?' '+memo:''}`;data.draft.push(label);addEntry({type:'income',method,amount,memo,label});data.balances[method]=(data.balances[method]||0)+amount;q('incomeAmount').value='';q('incomeMemo').value='';render()}
function balanceFix(){const method=q('fixMethod').value,amount=+q('fixAmount').value;if(!Number.isFinite(amount))return toast('実残高を入力');data.balances[method]=amount;const label=`【残高】\n${method} ${amount}`;data.draft.push(label);addEntry({type:'balance',method,amount,label});q('fixAmount').value='';render()}
window.recoverProxy=id=>{const x=data.receivables.find(x=>x.id===id);if(!x)return;const raw=prompt(`回収額（残 ${x.remaining}円）`,String(x.remaining));if(raw===null)return;const amount=Math.min(+raw||0,x.remaining);if(!amount)return;const to=prompt('入金先','財布')||'財布';const kind=confirm('「OK」=回収、「キャンセル」=免除')?'回収':'免除';x.remaining-=amount;if(x.remaining<=0){x.remaining=0;x.status='paid'};if(kind==='回収'&&data.balances[to]!==undefined)data.balances[to]+=amount;data.recoveries.push({id:uid(),receivableId:id,date:today(),memo:x.memo,amount,to,kind});data.draft.push(`代理 ${amount} ${kind==='回収'?'回収 '+to:'免除'} ${x.memo}`);render()}
window.delEntry=id=>{const e=data.entries.find(x=>x.id===id);if(!confirm('この履歴を削除しますか？残高は自動では戻りません。'))return;data.entries=data.entries.filter(x=>x.id!==id);if(e?.category==='代理')data.receivables=data.receivables.filter(x=>x.entryId!==id);render()};window.delInstall=id=>{data.installments=data.installments.filter(x=>x.id!==id);render()}
function addInstall(){const name=q('installName').value.trim(),card=q('installCard').value,category=q('installCat').value,amount=+q('installAmount').value,startYM=q('installStart').value,endYM=q('installEnd').value;if(!name||!amount||!startYM||!endYM)return toast('分割情報を入力');data.installments.push({id:uid(),name,card,category,amount,startYM,endYM});['installName','installAmount','installStart','installEnd'].forEach(id=>q(id).value='');render()}
function editOpening(){for(const k of moneyMethods){const v=prompt(`${k}の月初資金`,String(data.openingBalances?.[k]??data.balances[k]??0));if(v===null)continue;if(Number.isFinite(+v))data.openingBalances[k]=+v}render()}
function closeMonth(){addRestorePoint(`${currentYM()} 月締め前`);if(!confirm(`${data.year}年${data.month}月を締めて翌月へ進みますか？`))return;const s=catSums(),total=Object.values(s).reduce((a,b)=>a+b,0);data.snapshots.push({ym:currentYM(),closedAt:new Date().toISOString(),balances:{...data.balances},proxyTotal:proxySum(),categorySums:s,totalExpense:total,report:report()});data.month++;if(data.month===13){data.month=1;data.year++}data.openingBalances={...data.balances};data.cardViewMonth=currentYM();data.draft=[];render();toast('翌月を開始しました')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['home','input','card','proxy','analysis','report'].forEach(v=>q('view-'+v).classList.add('hidden'));q('view-'+b.dataset.view).classList.remove('hidden');render()});
q('addExpense').onclick=addExpense;q('addIncome').onclick=addIncome;q('balanceFix').onclick=balanceFix;q('copy').onclick=()=>copy(q('copyBox').textContent);q('clearDraft').onclick=()=>{data.draft=[];render()};q('applyCardMonth').onclick=()=>{data.cardViewMonth=q('cardViewMonth').value||currentYM();render()};q('cardSearch').oninput=renderCards;q('proxySearch').oninput=renderProxy;q('addInstall').onclick=addInstall;q('copyReport').onclick=()=>copy(q('reportBox').textContent);q('copyBackup').onclick=()=>copy(q('backup').value);q('restoreBackup').onclick=()=>{try{addRestorePoint('バックアップ復元前');const obj=JSON.parse(q('backup').value);if(!confirm('バックアップ内容で上書きしますか？'))return;data=obj;render();toast('復元しました')}catch{toast('JSON形式を確認')}};q('saveRestorePoint').onclick=()=>{const label=prompt('復元ポイント名',`${currentYM()} 手動保存`);if(label===null)return;addRestorePoint(label||`${currentYM()} 手動保存`);render();toast('保存しました')};q('saveYM').onclick=()=>{data.year=+q('year').value||data.year;data.month=+q('month').value||data.month;data.cardViewMonth=currentYM();render()};q('importLegacy').onclick=()=>{try{addRestorePoint('旧データ取込前');const raw=localStorage.getItem(OLD_KEY);if(!raw)return toast('旧v0.5データが見つかりません');if(!confirm('旧v0.5データを読み込み、現在のv0.6データを置き換えますか？'))return;data=migrate(JSON.parse(raw));render();toast('旧データを復旧しました')}catch{toast('旧データの読込に失敗しました')}};q('fullJulyRecovery').onclick=()=>{addRestorePoint('7月完全復旧前');if(!confirm('7月末の確定データで現在の内容を置き換えますか？'))return;data=fullRecovery();render();toast('7月末まで復旧しました')};q('editOpening').onclick=editOpening;q('closeMonth').onclick=closeMonth;q('reset').onclick=()=>{addRestorePoint('全初期化前');if(confirm('全データを初期化しますか？')){localStorage.removeItem(KEY);data=blank();render()}};
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{}))}render();
</script></body></html>
